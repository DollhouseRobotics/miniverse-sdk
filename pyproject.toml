[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miniverse-sdk"
version = "0.4.4"
description = "Validate and upload Dollhouse Robotics Miniverse simulation bundles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "keyring>=25,<26",
  "numpy>=1.24,<3",
  "onnx>=1.17,<2",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dollhouse Robotics" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
miniverse = "miniverse_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miniverse_sdk = ["agent_help/*.md", "schemas/*.json"]

[project.urls]
Homepage = "https://miniverse.bot"
Repository = "https://github.com/DollhouseRobotics/miniverse-sdk"
Issues = "https://github.com/DollhouseRobotics/miniverse-sdk/issues"
